[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "wavesmith"
version = "0.1.0"
description = "Local-first audio-reactive video generator for music visualizers."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [
  { name = "Christian Kajsing" },
]
dependencies = [
  "librosa>=0.10",
  "numpy>=1.26",
  "pillow>=10",
  "pydantic>=2",
  "pyyaml>=6",
  "rich>=13",
  "soundfile>=0.12",
  "typer>=0.12",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "ruff>=0.5",
]

[project.scripts]
wavesmith = "wavesmith.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["wavesmith"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = [
  "ignore:'aifc' is deprecated and slated for removal in Python 3.13:DeprecationWarning:audioread.rawread",
  "ignore:'audioop' is deprecated and slated for removal in Python 3.13:DeprecationWarning:audioread.rawread",
  "ignore:'sunau' is deprecated and slated for removal in Python 3.13:DeprecationWarning:audioread.rawread",
]
